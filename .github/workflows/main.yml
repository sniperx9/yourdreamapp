name: Build iOS App

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: 'stable'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build IPA with Flet
        run: yes | flet build ipa

      # الخطوة الجديدة لتجميع التطبيق في ملف IPA بدون شهادة مطور
      - name: Package Unsigned IPA
        run: |
          mkdir -p Payload
          find build/ipa -name "*.app" -exec cp -R {} Payload/ \;
          zip -qr app.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: app-ipa
          path: app.ipa
